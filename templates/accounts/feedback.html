<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | VideoSnap</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        .container{
            width:90%;
            max-width:700px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,.1);
        }

        h1{
            text-align:center;
            color:#007BFF;
            margin-bottom:15px;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:30px;
            line-height:1.6;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#333;
        }

        input,
        textarea,
        select{
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        textarea{
            resize:vertical;
        }

        button{
            width:100%;
            padding:14px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>Feedback</h1>

    <p>
        We value your feedback. Please share your experience and suggestions to help us improve VideoSnap.
    </p>

    <form>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email">

        <label>Rating</label>
        <select>
            <option>⭐⭐⭐⭐⭐ Excellent</option>
            <option>⭐⭐⭐⭐ Very Good</option>
            <option>⭐⭐⭐ Good</option>
            <option>⭐⭐ Average</option>
            <option>⭐ Poor</option>
        </select>

        <label>Your Feedback</label>
        <textarea rows="6" placeholder="Write your feedback here..."></textarea>

        <button type="submit">Submit Feedback</button>

    </form>

</div>

</body>
</html>
