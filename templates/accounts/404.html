<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | VideoSnap</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            width:90%;
            max-width:700px;
            padding:50px;
            text-align:center;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        h1{
            font-size:100px;
            color:#007BFF;
            margin-bottom:10px;
        }

        h2{
            color:#333;
            margin-bottom:20px;
        }

        p{
            color:#666;
            line-height:1.7;
            margin-bottom:30px;
        }

        .btn{
            display:inline-block;
            background:#007BFF;
            color:white;
            text-decoration:none;
            padding:12px 25px;
            border-radius:5px;
        }

        .btn:hover{
            background:#0056b3;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>404</h1>

    <h2>Oops! Page Not Found</h2>

    <p>
        The page you are looking for doesn't exist or may have been moved.
        Please check the URL or return to the homepage.
    </p>

    <a href="{% url 'home' %}" class="btn">Go to Home</a>

</div>

</body>
</html>
