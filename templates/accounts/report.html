<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report a Problem - VideoSnap</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        .container{
            width:90%;
            max-width:800px;
            margin:50px auto;
            background:#fff;
            padding:40px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }

        h1{
            text-align:center;
            color:#007BFF;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#666;
            margin-bottom:30px;
        }

        label{
            display:block;
            margin-top:18px;
            margin-bottom:6px;
            font-weight:bold;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:16px;
        }

        textarea{
            resize:vertical;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:14px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:6px;
            font-size:17px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        .btn{
            display:inline-block;
            margin-top:25px;
            text-decoration:none;
            color:#007BFF;
            font-weight:bold;
        }

        .btn:hover{
            text-decoration:underline;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>Report a Problem</h1>

    <p class="subtitle">
        Found a bug or facing an issue? Let us know and we'll work to fix it.
    </p>

    <form method="POST">

        {% csrf_token %}

        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your name" required>

        <label>Email Address</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Problem Category</label>

        <select name="category">

            <option>Login Issue</option>
            <option>Signup Issue</option>
            <option>Video Upload Problem</option>
            <option>Playback Error</option>
            <option>Account Issue</option>
            <option>Website Bug</option>
            <option>Other</option>

        </select>

        <label>Describe the Problem</label>

        <textarea
            name="problem"
            rows="7"
            placeholder="Describe your issue in detail..."
            required></textarea>

        <button type="submit">
            Submit Report
        </button>

    </form>

    <a href="{% url 'home' %}" class="btn">
        ← Back to Home
    </a>

</div>

</body>
</html>
