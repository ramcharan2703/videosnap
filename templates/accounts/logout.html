<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <style>
        body{
            margin:0;
            padding:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f4f4f4;
            font-family:Arial, sans-serif;
        }

        .box{
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
            text-align:center;
            width:350px;
        }

        h2{
            color:#28a745;
        }

        p{
            margin:20px 0;
        }

        a{
            text-decoration:none;
            background:#007bff;
            color:#fff;
            padding:10px 20px;
            border-radius:5px;
        }

        a:hover{
            background:#0056b3;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>You have been logged out.</h2>
    <p>Thank you for visiting.</p>

    <a href="{% url 'login' %}">Login Again</a>
</div>

</body>
</html>
